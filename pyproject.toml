[project]
name = "pursuit"
version = "1.0.0"
description = "Internship discovery pipeline: a catalog miner for GitHub internship lists and a real-time ATS monitor with Discord alerts"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31,<3",
    "python-dotenv>=1.0,<2",
]

[tool.setuptools]
packages = ["catalog", "monitor", "monitor.sources"]
